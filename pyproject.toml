[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-media-pass"
version = "0.2.0"
description = "The All-Access Google Media & Multimodal MCP Server: Video Analysis, Veo 3.1 AI Video Generation, Stitch UI Studio, Flow Music, image generation, Gemini TTS, and 2M Docs for Claude, Hermes, and Cursor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "fullvaluedan" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "gemini",
    "claude",
    "hermes",
    "gemini-media-pass",
    "veo",
    "google-flow",
    "stitch",
    "flow-music",
    "video-analysis",
    "image-generation",
    "imagen",
    "multimodal",
    "antigravity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "edge-tts>=6.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
qa = ["faster-whisper>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
gemini-usage = "gemini_media_pass_mcp.receipts:main"
gemini-media-pass = "gemini_media_pass_mcp.server:main"
gemini-media-pass-mcp = "gemini_media_pass_mcp.server:main"
gemini-media-pass-login = "gemini_media_pass_mcp.auth:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_media_pass_mcp"]
