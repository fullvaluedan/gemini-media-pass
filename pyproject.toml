[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-lens-mcp"
version = "0.1.0"
description = "Multimodal Video/Audio Analysis, Imagen Image Generation, 2M Doc Reading, and Gemini Pro/Flash MCP Server for Claude, Hermes, and Cursor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Community", email = "dev@example.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "gemini",
    "claude",
    "hermes",
    "gemini-lens",
    "video-analysis",
    "image-generation",
    "imagen",
    "multimodal",
    "antigravity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "edge-tts>=6.1.0",
]

[project.scripts]
gemini-lens = "gemini_lens_mcp.server:main"
gemini-lens-mcp = "gemini_lens_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_lens_mcp"]
